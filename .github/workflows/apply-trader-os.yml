name: Apply Trader OS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-trader-os.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Trader OS production files
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .trader-os/payload.00 \
            .trader-os/payload.01 \
            .trader-os/payload.02 \
            .trader-os/payload.03 \
            .trader-os/payload.04 \
            .trader-os/payload.05 \
            > /tmp/trader-os.b64
          base64 --decode /tmp/trader-os.b64 > /tmp/trader-os.tar.gz
          tar -xzf /tmp/trader-os.tar.gz -C .
          rm -rf .trader-os
          rm -f .github/workflows/apply-trader-os.yml

      - name: Commit production files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Launch TradeInsight Trader OS [skip ci]"
          git push
